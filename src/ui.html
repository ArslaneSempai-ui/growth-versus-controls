<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growth versus controls — and whether the argument can be settled</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eeece6'/%3E%3Cpath d='M3 11h4V5H3zM9 11h4V8H9z' fill='%2314603f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
    <div class="lang"><button id="fr" type="button">FR</button><button id="en" type="button">EN</button></div>
  </div>

  <div class="renvoi" id="bandeau"></div>

  <div id="verdict"></div>

  <h2 id="titreBascule"></h2>
  <div id="bascule"></div>

  <h2 id="titreEscalier"></h2>
  <div id="escalier"></div>

  <h2 id="titreLeviers"></h2>
  <div id="leviers"></div>

  <h2 id="titreReglages"></h2>
  <div id="reglages"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script type="module">
import { axe, barres, escalier as figEscalier, opposees, brancher } from "/graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/*
 * Un écran, deux hôtes.
 *
 * En local, il parle au serveur Node. Publié sur GitHub Pages il n'y a pas de serveur : un
 * shim installé avant ce script répond aux mêmes routes avec les mêmes formes. Deux écrans
 * divergeraient au premier correctif ; celui-ci est le seul.
 */
const api = async (chemin, corps) => {
  if (window.LOCAL) return window.LOCAL(chemin, corps);
  const r = await fetch(chemin, corps
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) }
    : {});
  return r.json();
};

const T = {
  fr: {
    h1: "Les deux ont raison, et ça ne suffit pas",
    lede: "La croissance apporte un test, la conformité apporte une projection. Personne ne les met sur le même axe.",
    bandeau: "Tout tourne dans ton navigateur. Le test A/B est <b>mesuré</b> ; la part de risque non détecté est <b>supposée</b>, parce que ce sont les dossiers qu'on n'a jamais ouverts. Les deux ne se lisent pas de la même façon.",

    titreVerdict: "Ce que le changement vaut, des deux côtés",
    figVerdictTitre: "La même décision, en dollars par an",
    figVerdictAria: "Trois barres avec leurs intervalles : ce que la croissance gagne, ce que le contrôle coûte, et le net.",
    croissance: "ce que la croissance gagne",
    controle: "ce que le contrôle coûte",
    net: "net",
    suiteTranchable: (sens, bas, haut) => `Le signe tient sur tout l'intervalle : <b>${sens}</b>. Entre ${bas} et ${haut} par an.`,
    suiteNonTranchable: "<b>L'intervalle contient zéro.</b> Ces preuves ne peuvent pas décider du sens. Tout ce qu'on peut dire honnêtement, c'est qu'on ne sait pas.",
    suiteSigne: (par) => par === "le test"
      ? "Et c'est le test qui en décide."
      : "Attention : ce n'est <b>pas</b> le test qui décide de ce signe, ce sont les hypothèses. Le test fixe l'ampleur.",

    titreBascule: "Le seul nombre que personne ne mesure",
    figBasculeTitre: "La part de risque non détecté, et l'endroit où le signe change",
    figBasculeAria: "Un axe de la part de risque non détecté parmi les clients gagnés. La bascule est marquée, et la fourchette que les deux fonctions défendent est encadrée.",
    basculeA: (v) => `bascule · ${v}`,
    basculeAvant: "le changement paie",
    basculeApres: "le contrôle a raison",
    zonePaie: (a, b) => `${a} – ${b} : le changement paie`,
    zoneControle: (a, b) => `${a} – ${b} : le contrôle a raison`,
    defendu: (a, b) => `Les deux fonctions défendent la même fourchette, ${a} – ${b} ; la bascule la coupe en deux.`,
    motRecouvrement: "les deux positions tiennent",
    suiteBascule: (part, phrase) => `<b>${part} de la fourchette défendue</b> penche pour le changement. ${phrase}`,
    dedansOui: "Les deux positions sont cohérentes : ce désaccord se règle par une mesure, pas par une réunion.",
    dedansNonBas: "Même la lecture la plus optimiste donne raison au contrôle.",
    dedansNonHaut: "Même la lecture la plus prudente donne raison au changement.",

    titreEscalier: "La capacité s'achète entière",
    figEscalierTitre: "Ce que le contrôle coûte, en fonction des clients gagnés",
    figEscalierAria: "Une fonction en marches : sous la capacité déjà payée le coût est nul, puis chaque analyste supplémentaire ajoute un salaire entier.",
    suiteEscalier: (bas, haut) => `L'intervalle du test va de <b>${bas}</b> à <b>${haut}</b> analyste(s) à embaucher. Le même test dit à la fois « ça ne coûte rien de plus » et « ça coûte un salaire » — ce n'est pas une contradiction, c'est une marche.`,
    suiteEscalierPlat: "L'intervalle du test tient entier dans une seule marche : la capacité n'est pas le sujet ici.",

    titreLeviers: "Ce qui trancherait, et ce qui ne trancherait pas",
    figLeviersTitre: "Largeur de l'intervalle restante, après chaque effort",
    figLeviersAria: "Deux barres comparant la largeur d'intervalle qui subsiste après avoir agrandi le test, ou après avoir mesuré l'hypothèse.",
    tranche: "tranche",
    tranchePas: "ne tranche pas",
    suiteLeviers: "Agrandir le test est ce que la salle réclame toujours. Ici il resserre un intervalle dont le signe n'a jamais dépendu.",

    titreReglages: "Les trois désaccords, réglables",
    reglagePart: "part de risque non détecté parmi les clients gagnés",
    reglageHeures: "heures d'analyste déjà payées et libres, par an",
    reglageCout: "ce que coûte un incident non détecté",
    reglageCroyanceBas: "borne basse de ce qui est défendu",
    reglageCroyanceHaut: "borne haute de ce qui est défendu",
    remise: "Revenir au cas de départ",
    provenance: "mesuré · supposé · choisi — chaque entrée porte sa provenance, et l'incertitude du verdict vient d'abord des supposées.",
  },
  en: {
    h1: "Both sides are right, and that isn't enough",
    lede: "Growth brings a test, controls bring a projection. Nobody puts them on the same axis.",
    bandeau: "Everything runs in your browser. The A/B test is <b>measured</b>; the undetected-risk share is <b>assumed</b>, because those are the files nobody ever opened. The two do not read the same way.",

    titreVerdict: "What the change is worth, from both sides",
    figVerdictTitre: "The same decision, in dollars a year",
    figVerdictAria: "Three bars with their intervals: what growth gains, what controls cost, and the net.",
    croissance: "what growth gains",
    controle: "what controls cost",
    net: "net",
    suiteTranchable: (sens, bas, haut) => `The sign holds across the whole interval: <b>${sens}</b>. Between ${bas} and ${haut} a year.`,
    suiteNonTranchable: "<b>The interval contains zero.</b> This evidence cannot decide the sign. The honest answer is that we do not know.",
    suiteSigne: (par) => par === "le test"
      ? "And it is the test that decides it."
      : "Careful: that sign is <b>not</b> decided by the test — it is decided by the assumptions. The test sets the size.",

    titreBascule: "The one number nobody measures",
    figBasculeTitre: "The undetected-risk share, and where the sign flips",
    figBasculeAria: "An axis of the undetected-risk share among gained customers. The flip point is marked, and the range both functions defend is shaded.",
    basculeA: (v) => `flips at · ${v}`,
    basculeAvant: "the change pays",
    basculeApres: "the controls are right",
    zonePaie: (a, b) => `${a} – ${b}: the change pays`,
    zoneControle: (a, b) => `${a} – ${b}: the controls win`,
    defendu: (a, b) => `Both functions defend the same range, ${a} – ${b}; the flip point cuts it in two.`,
    motRecouvrement: "both positions hold",
    suiteBascule: (part, phrase) => `<b>${part} of the defended range</b> favours the change. ${phrase}`,
    dedansOui: "Both positions are coherent: this disagreement is settled by a measurement, not by a meeting.",
    dedansNonBas: "Even the most optimistic reading favours the controls.",
    dedansNonHaut: "Even the most cautious reading favours the change.",

    titreEscalier: "Capacity is bought whole",
    figEscalierTitre: "What controls cost, against customers gained",
    figEscalierAria: "A step function: below the capacity already paid for the cost is nil, then each further analyst adds a whole salary.",
    suiteEscalier: (bas, haut) => `The test's interval runs from <b>${bas}</b> to <b>${haut}</b> analyst(s) to hire. The same test says both "costs nothing extra" and "costs a whole salary" — not a contradiction, a step.`,
    suiteEscalierPlat: "The test's interval sits entirely inside one step: capacity is not the question here.",

    titreLeviers: "What would settle it, and what would not",
    figLeviersTitre: "Interval width left, after each effort",
    figLeviersAria: "Two bars comparing the interval width that remains after enlarging the test, or after measuring the assumption.",
    tranche: "settles it",
    tranchePas: "does not settle it",
    suiteLeviers: "Enlarging the test is what the room always asks for. Here it narrows an interval whose sign never depended on it.",

    titreReglages: "The three disagreements, adjustable",
    reglagePart: "undetected-risk share among gained customers",
    reglageHeures: "analyst hours already paid for and idle, per year",
    reglageCout: "what one undetected incident costs",
    reglageCroyanceBas: "low end of what is defended",
    reglageCroyanceHaut: "high end of what is defended",
    remise: "Back to the starting case",
    provenance: "measured · assumed · chosen — every input carries its provenance, and the verdict's uncertainty comes first from the assumed ones.",
  },
};

let langue = localStorage.getItem("langue") === "fr" ? "fr" : "en";
const t = () => T[langue];
let etat = null;

const dollars = (x) => (x < 0 ? "−" : "") + "$" + Math.round(Math.abs(x)).toLocaleString(langue === "fr" ? "fr-FR" : "en-GB");
const pc = (x, d = 2) => (x * 100).toFixed(d) + " %";
const nb = (x) => Math.round(x).toLocaleString(langue === "fr" ? "fr-FR" : "en-GB");

function blocVerdict() {
  const L = t(), v = etat.verdict;
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#bandeau").innerHTML = L.bandeau;

  /*
   * Les trois montants côte à côte, chacun avec son intervalle.
   *
   * C'est l'image que la réunion n'a jamais : les deux fonctions arrivent avec deux slides
   * qui ne partagent pas d'axe. Le contrôle est porté en négatif parce que c'est une sortie
   * de caisse — le lire en positif à côté d'un revenu est la confusion d'origine.
   */
  const fig = opposees({
    items: [
      { nom: L.croissance, valeur: v.croissance.centre, bas: v.croissance.bas, haut: v.croissance.haut },
      { nom: L.controle, valeur: -v.controle.centre, bas: -v.controle.haut, haut: -v.controle.bas },
      { nom: L.net, valeur: v.net.centre, bas: v.net.bas, haut: v.net.haut, ici: true },
    ],
    fmt: dollars, aria: L.figVerdictAria,
  });

  const sens = v.sens === "croissance" ? (langue === "fr" ? "la croissance l'emporte" : "growth wins")
    : v.sens === "contrôle" ? (langue === "fr" ? "le contrôle l'emporte" : "the controls win") : "";
  const suite = v.tranchable
    ? L.suiteTranchable(sens, dollars(v.net.bas), dollars(v.net.haut))
    : L.suiteNonTranchable;

  $("#verdict").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figVerdictTitre)}</div>${fig}
    <div class="suite">${suite} ${L.suiteSigne(v.signeDecidePar)}</div>
  </div></section>`;
}

function blocBascule() {
  const L = t(), d = etat.desaccord, s = etat.situation;
  $("#titreBascule").textContent = L.titreBascule;

  /*
   * Les deux camps sur le même axe, et la bascule dedans.
   *
   * `populations` sert ici à autre chose que des scores : chaque carré est un point de la
   * fourchette que l'une des deux fonctions est prête à défendre. Le recouvrement dessiné
   * est l'endroit où les deux positions tiennent en même temps — la seule zone où la
   * discussion a un sens.
   */
  const marge = Math.max((s.croyance.haut - s.croyance.bas) * 0.15, 0.002);
  const fig = axe({
    bas: Math.max(0, Math.min(s.croyance.bas, d.bascule) - marge),
    haut: Math.max(s.croyance.haut, d.bascule) + marge,
    /* Les bandes portent déjà ce que chaque côté veut dire, avec ses bornes : répéter
     * « le changement paie » au-dessus de la ligne ne fait que doubler le texte. */
    seuil: { v: d.bascule, etiquette: L.basculeA(pc(d.bascule)) },
    bandes: [
      { de: s.croyance.bas, a: d.bascule, nom: L.zonePaie(pc(s.croyance.bas), pc(d.bascule)) },
      { de: d.bascule, a: s.croyance.haut, nom: L.zoneControle(pc(d.bascule), pc(s.croyance.haut)), sens: "bas" },
    ],
    fmtX: (v) => pc(v, 2),
    aria: L.figBasculeAria,
  });

  const phrase = d.dedans ? L.dedansOui
    : d.bascule <= s.croyance.bas ? L.dedansNonBas : L.dedansNonHaut;

  $("#bascule").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figBasculeTitre)}</div>${fig}
    <div class="suite">${L.defendu(pc(s.croyance.bas), pc(s.croyance.haut))} ${L.suiteBascule(pc(d.partPourLeChangement, 0), phrase)}</div>
  </div></section>`;
}

function blocEscalier() {
  const L = t(), v = etat.verdict, e = etat.escalier;
  $("#titreEscalier").textContent = L.titreEscalier;

  const fig = figEscalier({
    marches: e.marches.map((m) => ({ de: m.de, a: m.a, valeur: m.valeur, ici: m.ici, gratuite: m.gratuite })),
    fmt: dollars, fmtX: nb, aria: L.figEscalierAria,
  });

  const suite = v.enjambeUneMarche
    ? L.suiteEscalier(v.analystes.bas, v.analystes.haut)
    : L.suiteEscalierPlat;

  $("#escalier").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figEscalierTitre)}</div>${fig}
    <div class="suite">${suite}</div>
  </div></section>`;
}

function blocLeviers() {
  const L = t();
  $("#titreLeviers").textContent = L.titreLeviers;
  const fig = barres({
    items: etat.leviers.map((l) => ({
      nom: l.quoi, valeur: Math.max(0, l.largeurRestante),
      ton: l.utile ? "accent" : "neutre",
      note: l.utile ? L.tranche : L.tranchePas,
    })),
    fmt: dollars, aria: L.figLeviersAria,
  });
  $("#leviers").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figLeviersTitre)}</div>${fig}
    <div class="suite">${L.suiteLeviers}</div>
  </div></section>`;
}

function blocReglages() {
  const L = t(), s = etat.situation, b = etat.bornes;
  $("#titreReglages").textContent = L.titreReglages;
  const curseur = (id, nom, valeur, [bas, haut], pas, affiche) => `
    <div class="rang">
      <span class="bout">${esc(nom)}</span>
      <input type="range" id="${id}" min="${bas}" max="${haut}" step="${pas}" value="${valeur}"
        aria-label="${esc(nom)}" style="flex:1;min-width:140px" />
      <span class="lecture" id="${id}Val">${esc(affiche)}</span>
    </div>`;

  $("#reglages").innerHTML = `<section class="feuillet"><div class="corps">
    ${curseur("part", L.reglagePart, s.partNonDetectee, b.partNonDetectee, 0.0005, pc(s.partNonDetectee))}
    ${curseur("heures", L.reglageHeures, s.heuresLibres, b.heuresLibres, 100, nb(s.heuresLibres) + " h")}
    ${curseur("cout", L.reglageCout, s.coutRisqueNonDetecte, b.coutRisqueNonDetecte, 10000, dollars(s.coutRisqueNonDetecte))}
    ${curseur("cbas", L.reglageCroyanceBas, s.croyance.bas, b.partNonDetectee, 0.0005, pc(s.croyance.bas))}
    ${curseur("chaut", L.reglageCroyanceHaut, s.croyance.haut, b.partNonDetectee, 0.0005, pc(s.croyance.haut))}
    <div class="rang" style="margin-top:14px"><button class="b" id="remise" type="button">${esc(L.remise)}</button></div>
  </div></section>`;

  const envoyer = async (corps) => { etat = await api("/api/reglage", corps); dessiner(); };
  const brancherCurseur = (id, cle, affiche) => {
    const el = $("#" + id);
    el.oninput = () => { $("#" + id + "Val").textContent = affiche(Number(el.value)); };
    el.onchange = () => envoyer({ [cle]: Number(el.value) });
  };
  brancherCurseur("part", "partNonDetectee", (v) => pc(v));
  brancherCurseur("heures", "heuresLibres", (v) => nb(v) + " h");
  brancherCurseur("cout", "coutRisqueNonDetecte", (v) => dollars(v));
  brancherCurseur("cbas", "croyanceBas", (v) => pc(v));
  brancherCurseur("chaut", "croyanceHaut", (v) => pc(v));
  $("#remise").onclick = async () => { etat = await api("/api/remise", {}); dessiner(); };
}

function dessiner() {
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";
  blocVerdict();
  blocBascule();
  blocEscalier();
  blocLeviers();
  blocReglages();
  $("#provenanceLegende").textContent = t().provenance;
  brancher(document);
}

for (const l of ["fr", "en"]) {
  $("#" + l).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

etat = await api("/api/etat");
dessiner();
</script>
</body>
</html>
