<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growth versus controls — and whether the argument can be settled</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23eeece6'/%3E%3Cpath d='M3 11h4V5H3zM9 11h4V8H9z' fill='%2314603f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
  </div>

  <p class="renvoi" style="margin-bottom:1.5rem">
This is the whole model, running in your browser — no server, nothing uploaded.
<b>Grab the point on the map</b> and read the verdict where you put it: its two axes are
the numbers nobody measures, and the whole argument turns on them.
<a href="https://github.com/ArslaneSempai-ui/growth-versus-controls">Source and method</a>.
</p>
  <div class="renvoi" id="bandeau"></div>

  <div id="verdict"></div>

  <h2 id="titreBascule"></h2>
  <div id="bascule"></div>

  <h2 id="titreLeviers"></h2>
  <div id="leviers"></div>

  <h2 id="titreReglages"></h2>
  <div id="reglages"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script>window.LOCAL_PRET = new Promise((r) => { window.LOCAL_POSE = r; });</script>
<script type="module">
import { CAS } from "./js/situation.js";
import { arbitrer, bascule, ceQuiTrancherait, desaccordReel, ecartConversion } from "./js/arbitrage.js";

/* Les mêmes bornes que le serveur : une saisie absurde produit un verdict qui a l'air de
 * sortir du modèle alors qu'il sort de la saisie. */
const BORNES = {
  partNonDetectee: [0, 0.06],
  heuresLibres: [0, 8000],
  coutRisqueNonDetecte: [20000, 600000],
};

let situation = structuredClone(CAS);

const RESOLUTION = { x: 46, y: 29 };
function champ(s) {
  const [px0, px1] = BORNES.partNonDetectee;
  const [py0, py1] = BORNES.coutRisqueNonDetecte;
  const out = [];
  for (let j = 0; j < RESOLUTION.y; j++) {
    const cout = py0 + ((j + 0.5) / RESOLUTION.y) * (py1 - py0);
    for (let i = 0; i < RESOLUTION.x; i++) {
      const part = px0 + ((i + 0.5) / RESOLUTION.x) * (px1 - px0);
      out.push(arbitrer({ ...s, coutRisqueNonDetecte: cout }, part).net.centre >= 0);
    }
  }
  return out;
}

const etat = () => ({
  situation,
  bornes: BORNES,
  ecart: ecartConversion(situation),
  verdict: arbitrer(situation),
  bascule: bascule(situation),
  desaccord: desaccordReel(situation),
  leviers: ceQuiTrancherait(situation),
  champ: champ(situation),
  resolution: RESOLUTION,
});

window.LOCAL = async (chemin, corps) => {
  if (chemin === "/api/etat") return etat();
  if (chemin === "/api/remise") { situation = structuredClone(CAS); return etat(); }
  if (chemin === "/api/reglage") {
    for (const [cle, [bas, haut]] of Object.entries(BORNES)) {
      const v = Number(corps?.[cle]);
      if (Number.isFinite(v)) situation[cle] = Math.min(haut, Math.max(bas, v));
    }
    const cb = Number(corps?.croyanceBas), ch = Number(corps?.croyanceHaut);
    if (Number.isFinite(cb)) situation.croyance.bas = Math.min(Math.max(0, cb), situation.croyance.haut);
    if (Number.isFinite(ch)) situation.croyance.haut = Math.max(Math.min(BORNES.partNonDetectee[1], ch), situation.croyance.bas);
    return etat();
  }
  return {};
};

/* Le shim est en place : l'écran peut partir. La balise classique qui a créé la promesse
 * s'exécute avant tout module, donc personne ne peut la manquer. */
window.LOCAL_POSE && window.LOCAL_POSE();
</script>
<script type="module">
import { carte, opposees, saisir, brancher } from "./graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/*
 * Un écran, deux hôtes.
 *
 * En local, il parle au serveur Node. Publié sur GitHub Pages il n'y a pas de serveur : un
 * shim installé avant ce script répond aux mêmes routes avec les mêmes formes. Deux écrans
 * divergeraient au premier correctif ; celui-ci est le seul.
 */
/*
 * Attendre que le shim soit posé, quand il y en a un.
 *
 * Sur l'hôte statique, le shim est un module qui importe six fichiers ; l'écran n'en
 * importe qu'un. Si un seul de ces six tarde ou échoue, l'écran part avant lui, `api()`
 * tombe sur `fetch("/api/...")`, GitHub répond sa page 404 en HTML, et le lecteur reçoit
 * « Unexpected token '<' » avec un écran vide. Vu une fois sur cinq chargements de la
 * démo du banc, donc invisible pour qui vérifie une seule fois.
 *
 * Une balise classique posée avant les modules crée la promesse ; le shim la tient. En
 * local, `window.LOCAL_PRET` n'existe pas et rien n'attend.
 */
const pret = async () => { if (!window.LOCAL && window.LOCAL_PRET) await window.LOCAL_PRET; };

const api = async (chemin, corps) => {
  await pret();
  if (window.LOCAL) return window.LOCAL(chemin, corps);
  const r = await fetch(chemin, corps
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) }
    : {});
  return r.json();
};

const T = {
    h1: "Both sides are right, and that isn't enough",
    lede: "Growth brings a test, controls bring a projection. Nobody puts them on the same axis.",
    bandeau: "Everything runs in your browser. The A/B test is <b>measured</b>; the undetected-risk share is <b>assumed</b>, because those are the files nobody ever opened. The two do not read the same way.",

    titreVerdict: "What the change is worth, from both sides",
    figVerdictTitre: "The same decision, in dollars a year",
    figVerdictAria: "Three bars with their intervals: what growth gains, what controls cost, and the net.",
    croissance: "what growth gains",
    controle: "what controls cost",
    net: "net",
    suiteTranchable: (sens, bas, haut) => `The sign holds across the whole interval: <b>${sens}</b>. Between ${bas} and ${haut} a year.`,
    suiteNonTranchable: "<b>The interval contains zero.</b> This evidence cannot decide the sign. The honest answer is that we do not know.",
    suiteSigne: (par) => par === "le test"
      ? "And it is the test that decides it."
      : "Careful: that sign is <b>not</b> decided by the test — it is decided by the assumptions. The test sets the size.",

    dedansOui: "Both positions are coherent: this disagreement is settled by a measurement, not by a meeting.",
    dedansNonBas: "Even the most optimistic reading favours the controls.",
    dedansNonHaut: "Even the most cautious reading favours the change.",

    titreCarte: "Where are you on the map?",
    figCarteTitre: "The verdict over both unknowns — grab the point",
    figCarteAria: "A map of the verdict over two axes: the undetected-risk share and the cost of one incident. The point marks the position taken and can be dragged with mouse or finger.",
    axeX: "share of gained customers who are an undetected risk",
    axeY: "cost of one incident",
    bandeNom: "what both sides defend",
    clePour: "the change pays",
    cleContre: "the controls win",
    geste: "grab the point",
    suiteCarte: (b, part) => `The frontier runs through <b>${b}</b> at this incident price, and <b>${part}</b> of the defended range favours the change.`,
    suiteLeviersLong: (l) => `${l}. Enlarging the test is what the room always asks for: here it narrows an interval whose sign never depended on it.`,

    titreLeviers: "What would settle it, and what would not",
    tranche: "settles it",
    tranchePas: "does not settle it",
    suiteLeviers: "Enlarging the test is what the room always asks for. Here it narrows an interval whose sign never depended on it.",

    titreReglages: "The three disagreements, adjustable",
    reglagePart: "undetected-risk share among gained customers",
    reglageHeures: "analyst hours already paid for and idle, per year",
    reglageCout: "what one undetected incident costs",
    reglageCroyanceBas: "low end of what is defended",
    reglageCroyanceHaut: "high end of what is defended",
    remise: "Back to the starting case",
    provenance: "measured · assumed · chosen — every input carries its provenance, and the verdict's uncertainty comes first from the assumed ones.",
};

/* Le champ vient du modèle : la page lit, elle ne recalcule pas. */
const auChamp = (part, cout) => {
  const [px0, px1] = etat.bornes.partNonDetectee, [py0, py1] = etat.bornes.coutRisqueNonDetecte;
  const i = Math.min(etat.resolution.x - 1, Math.max(0, Math.floor(((part - px0) / (px1 - px0)) * etat.resolution.x)));
  const j = Math.min(etat.resolution.y - 1, Math.max(0, Math.floor(((cout - py0) / (py1 - py0)) * etat.resolution.y)));
  return etat.champ[j * etat.resolution.x + i] === true;
};

const t = () => T;
let etat = null;

const dollars = (x) => (x < 0 ? "−" : "") + "$" + Math.round(Math.abs(x)).toLocaleString("en-GB");
const pc = (x, d = 2) => (x * 100).toFixed(d) + " %";
const nb = (x) => Math.round(x).toLocaleString("en-GB");

function blocVerdict() {
  const L = t(), v = etat.verdict;
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#bandeau").innerHTML = L.bandeau;

  /*
   * Les trois montants côte à côte, chacun avec son intervalle.
   *
   * C'est l'image que la réunion n'a jamais : les deux fonctions arrivent avec deux slides
   * qui ne partagent pas d'axe. Le contrôle est porté en négatif parce que c'est une sortie
   * de caisse — le lire en positif à côté d'un revenu est la confusion d'origine.
   */
  const fig = opposees({
    items: [
      { nom: L.croissance, valeur: v.croissance.centre, bas: v.croissance.bas, haut: v.croissance.haut },
      { nom: L.controle, valeur: -v.controle.centre, bas: -v.controle.haut, haut: -v.controle.bas },
      { nom: L.net, valeur: v.net.centre, bas: v.net.bas, haut: v.net.haut, ici: true },
    ],
    fmt: dollars, aria: L.figVerdictAria,
  });

  const sens = v.sens === "croissance" ? "growth wins"
    : v.sens === "contrôle" ? "the controls win" : "";
  const suite = v.tranchable
    ? L.suiteTranchable(sens, dollars(v.net.bas), dollars(v.net.haut))
    : L.suiteNonTranchable;

  $("#verdict").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figVerdictTitre)}</div>${fig}
    <div class="suite">${suite} ${L.suiteSigne(v.signeDecidePar)}</div>
  </div></section>`;
}

function blocCarte() {
  const L = t(), s = etat.situation, d = etat.desaccord;
  $("#titreBascule").textContent = L.titreCarte;

  /*
   * La figure est la commande.
   *
   * Deux inconnues, deux axes, et le verdict comme territoire : on ne lit pas une valeur, on
   * pose son établissement quelque part et on lit la réponse à cet endroit. Le curseur qui
   * servait à régler la part de risque a disparu — piloter à l'aveugle une grandeur qu'on ne
   * connaît pas était le mauvais geste. Ici la question devient « de quel côté de cette ligne
   * sommes-nous ? », à laquelle un responsable conformité répond en une phrase.
   */
  const fig = carte({
    x: { de: 0, a: etat.bornes.partNonDetectee[1], nom: L.axeX, fmt: (v) => pc(v, 1) },
    y: { de: etat.bornes.coutRisqueNonDetecte[0], a: etat.bornes.coutRisqueNonDetecte[1],
         nom: L.axeY, fmt: (v) => "$" + Math.round(v / 1000) + "k" },
    verdict: auChamp,
    ici: { x: s.partNonDetectee, y: s.coutRisqueNonDetecte },
    bande: { de: s.croyance.bas, a: s.croyance.haut, nom: L.bandeNom },
    cles: { pour: L.clePour, contre: L.cleContre, geste: L.geste },
    aria: L.figCarteAria,
  });

  const phrase = d.dedans ? L.dedansOui
    : d.bascule <= s.croyance.bas ? L.dedansNonBas : L.dedansNonHaut;

  $("#bascule").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="titre-fig">${esc(L.figCarteTitre)}</div>${fig}
    <div class="suite">${L.suiteCarte(pc(d.bascule), pc(d.partPourLeChangement, 0))} ${phrase}</div>
  </div></section>`;

  /*
   * Le geste : on attrape le point, tout se recalcule.
   *
   * Un envoi à la fois, et le dernier demandé n'est pas jeté : sans ça, les appels partis
   * pendant un aller-retour se perdaient et l'écran restait en arrière de la main. Le
   * clavier a sa place aussi — une carte qu'on ne peut atteindre qu'à la souris n'est une
   * commande que pour une partie des lecteurs.
   */
  saisir($("#bascule"), poserPoint,
    { x: etat.situation.partNonDetectee, y: etat.situation.coutRisqueNonDetecte, nom: L.figCarteTitre });
}

/* Un envoi à la fois, et le dernier demandé n'est pas jeté : sinon les appels partis
 * pendant un aller-retour se perdent et l'écran reste en arrière de la main. */
let occupeCarte = false, carteEnAttente = null;
async function poserPoint(p) {
  if (occupeCarte) { carteEnAttente = p; return; }
  occupeCarte = true;
  try {
    etat = await api("/api/reglage", { partNonDetectee: p.x, coutRisqueNonDetecte: p.y });
    dessiner();
  } finally {
    occupeCarte = false;
    if (carteEnAttente) { const suite = carteEnAttente; carteEnAttente = null; poserPoint(suite); }
  }
}

function blocLeviers() {
  const L = t();
  $("#titreLeviers").textContent = L.titreLeviers;
  /*
   * Ceci était une figure à deux barres. Elle n'expliquait rien que la phrase ne dise, et ne
   * bougeait pas sous la main : du bruit bien dessiné. Une figure doit expliquer un mécanisme
   * ou se laisser manipuler ; celle-là ne faisait ni l'un ni l'autre.
   */
  const l = etat.leviers;
  $("#leviers").innerHTML = `<section class="feuillet"><div class="corps">
    <div class="suite">${L.suiteLeviersLong(
      l.map((x) => `<b>${esc(x.quoi)}</b> — ${x.utile ? L.tranche : L.tranchePas}`).join(" · "))}</div>
  </div></section>`;
}

function blocReglages() {
  const L = t(), s = etat.situation, b = etat.bornes;
  $("#titreReglages").textContent = L.titreReglages;
  const curseur = (id, nom, valeur, [bas, haut], pas, affiche) => `
    <div class="rang">
      <span class="bout">${esc(nom)}</span>
      <input type="range" id="${id}" min="${bas}" max="${haut}" step="${pas}" value="${valeur}"
        aria-label="${esc(nom)}" style="flex:1;min-width:140px" />
      <span class="lecture" id="${id}Val">${esc(affiche)}</span>
    </div>`;

  /*
   * Deux réglages ont quitté ce bloc : la part non détectée et le prix d'un incident.
   *
   * Ce sont les deux axes de la carte, et la carte se prend à la main. Les laisser ici en
   * double, c'était proposer deux façons de dire la même chose — dont une qui ne montre
   * rien. Restent les trois entrées qu'aucune figure ne porte : la capacité déjà libre, et
   * les deux bords de la fourchette que les deux fonctions défendent.
   */
  $("#reglages").innerHTML = `<section class="feuillet"><div class="corps">
    ${curseur("heures", L.reglageHeures, s.heuresLibres, b.heuresLibres, 100, nb(s.heuresLibres) + " h")}
    ${curseur("cbas", L.reglageCroyanceBas, s.croyance.bas, b.partNonDetectee, 0.0005, pc(s.croyance.bas))}
    ${curseur("chaut", L.reglageCroyanceHaut, s.croyance.haut, b.partNonDetectee, 0.0005, pc(s.croyance.haut))}
    <div class="rang" style="margin-top:14px"><button class="b" id="remise" type="button">${esc(L.remise)}</button></div>
  </div></section>`;

  const envoyer = async (corps) => { etat = await api("/api/reglage", corps); dessiner(); };
  const brancherCurseur = (id, cle, affiche) => {
    const el = $("#" + id);
    el.oninput = () => { $("#" + id + "Val").textContent = affiche(Number(el.value)); };
    el.onchange = () => envoyer({ [cle]: Number(el.value) });
  };
  brancherCurseur("heures", "heuresLibres", (v) => nb(v) + " h");
  brancherCurseur("cbas", "croyanceBas", (v) => pc(v));
  brancherCurseur("chaut", "croyanceHaut", (v) => pc(v));
  $("#remise").onclick = async () => { etat = await api("/api/remise", {}); dessiner(); };
}

function dessiner() {
  blocVerdict();
  blocCarte();
  blocLeviers();
  blocReglages();
  $("#provenanceLegende").textContent = t().provenance;
  brancher(document);
}

etat = await api("/api/etat");
dessiner();
</script>
</body>
</html>
